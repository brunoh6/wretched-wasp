# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.253.1/schema/sveltia-cms.json
# ─────────────────────────────────────────────────────────────────────────────
# Panel de administración del catálogo · DIHYC
# Motor: Sveltia CMS 0.253.1, versión FIJADA en index.html (https://sveltiacms.app)
#
# La primera línea NO es decorativa: engancha este archivo al esquema de la
# MISMA versión que carga index.html. En VS Code (con la extensión YAML) marca
# en rojo cualquier opción mal escrita o inventada ANTES de subirla. Si se sube
# de versión, se cambian las dos a la vez (ver README-admin.md, parte 2).
#
# POR QUÉ ESTE ARCHIVO ES ASÍ
#
# El sitio es estático y no tiene servidor ni base de datos. El "panel" es una
# página que habla directamente con GitHub: cuando el cliente pulsa Guardar, el
# CMS hace un commit en este mismo repositorio y el sitio se vuelve a construir.
# Por eso todo lo que el cliente puede tocar tiene que estar en un archivo del
# repositorio. Hoy son cuatro:
#   · src/data/catalog/overrides.json -> ficha, foto y visibilidad de cada grupo
#                                        de agua
#   · src/data/catalog/fm.json        -> ficha (y su página), foto y
#                                        visibilidad de la línea FM
#   · src/data/catalog/cards.json     -> las 4 tarjetas de la página /productos
#   · src/data/services.json          -> fotos y textos de los 4 servicios
#
# QUÉ NO ESTÁ AQUÍ Y POR QUÉ (explicado también en README-admin.md):
#   · Las medidas, SKU y materiales viven en products.json / groups.json, que
#     los REGENERA el importador de Excel. Las filas FM (medidas, SKU, SDR)
#     siguen en src/data/fmProducts.ts.
#   · Las categorías y las certificaciones son código TypeScript, no datos.
# ─────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: brunoh6/wretched-wasp
  # Se escribe directamente en main porque el sitio se publica desde main.
  branch: main
  # Sólo token mientras no exista el servicio de entrada (base_url): sin él,
  # "Iniciar sesión con GitHub" abre una ventana con "Not Found". Al montar la
  # entrada por correo (README-admin, parte 2 G) se cambia a [oauth].
  auth_methods: [token]

# Título de la pestaña y de la pantalla de entrada. Los botones del programa
# salen en español si el navegador está en español (Sveltia elige es-CO solo).
app_title: Panel DIHYC
# logo.src debe ser cuadrado: es también el icono de la pestaña.
logo:
  src: /admin/logo-panel.png
# site_url es la base de los enlaces "ver en la web" (preview_path); display_url
# es el enlace a la web que se ve en la cabecera del panel.
site_url: https://www.dihyc.com.pe
display_url: https://www.dihyc.com.pe/productos/

# La vista previa genérica de Sveltia no se parece a la web (pinta los valores
# sueltos) y le quita medio ancho al formulario.
editor:
  preview: false

# Carpeta GLOBAL de la biblioteca de medios: SOLO lo que sube el panel. La
# biblioteca deja borrar, renombrar y reemplazar todo lo que hay bajo esta
# carpeta y sólo corrige las rutas de overrides.json/cards.json, nunca las del
# código (.ts/.astro). Con public/assets entero, borrar el logo o una ficha FM
# "para ordenar" rompía la web. Los archivos del panel que el código también usa
# están COPIADOS aquí; los originales siguen en categories/, products/ y
# fichas-tecnicas/.
media_folder: public/assets/panel
public_folder: /assets/panel

# Nombres de archivo subidos en minúsculas, ASCII y con guiones: sin espacios,
# tildes, "°", "#" ni "%", que rompen enlaces ("Ficha #40.pdf" cortaba la ruta).
slug:
  encoding: ascii
  clean_accents: true
media_libraries:
  all:
    slugify_filename: true
    # 10 MB: el límite que vale para los PDF. Las fotos llevan el suyo (1 MB)
    # en cada campo, que manda sobre este. El tamaño se mide tras convertir.
    # En bytes decimales para que el aviso diga "10 MB" y no "10,5 MB".
    max_file_size: 10000000
  # Sin "Fotos de stock" (Unsplash, Pexels...): guardan una URL externa que la
  # CSP del sitio (img-src 'self') bloquea, y la foto sale vacía en la web.
  stock_assets: false

# Cómo se escribe el JSON al guardar. Se fija explícitamente para que los
# commits del CMS no reformateen los archivos y los cambios reales se vean
# limpios en el historial de GitHub.
output:
  # false = los campos vacíos siguen apareciendo como "" en el JSON.
  # Es lo que espera src/data/catalog/index.ts.
  omit_empty_optional_fields: false
  # false = las rutas se guardan tal cual. Con slugify_filename los archivos
  # nuevos ya no llevan espacios; los existentes no cambian de nombre.
  encode_file_path: false
  json:
    indent_style: space
    indent_size: 2

collections:
  # ═════════════════════════════════════════════════════════════════════════
  # GRUPOS DE PRODUCTO (línea Agua)
  #
  # Colección de ENTRADAS guardadas en un solo archivo: overrides.json es una
  # lista en la raíz y cada elemento es una entrada. Así el panel da buscador,
  # filtros, agrupación, miniatura y el nombre legible de cada grupo, en vez de
  # una lista plegada de códigos.
  #
  # Los grupos los crea el importador de Excel: crear, borrar o duplicar aquí
  # los desincronizaría de groups.json. El arrastre para reordenar no se puede
  # quitar en este tipo de colección, pero es inofensivo: index.ts busca por
  # groupKey, no por posición.
  #
  # label, family y groupKey los escribe el importador. Van como `hidden`: no se
  # ven y su valor se conserva al guardar (comprobado guardando en el panel). El
  # orden de los campos es el de las claves del JSON, para que un guardado no
  # reordene las filas.
  # ═════════════════════════════════════════════════════════════════════════
  - name: grupos
    label: Grupos de producto
    label_singular: Grupo
    icon: water_drop
    description: >-
      Productos de la línea **Agua** (PVC y CPVC). Un grupo son todas las
      medidas de un producto: su ficha, su foto y si se ve en la web valen para
      todas. Las fichas y fotos de la línea contra incendio (FM) están en
      «Línea contra incendio (FM)».
    file: src/data/catalog/overrides.json
    create: false
    delete: false
    duplicate: false
    identifier_field: label
    summary: '{{label}}'
    thumbnail: image
    sortable_fields: [label]
    view_filters:
      - label: Sin ficha técnica
        field: technicalSheet
        empty: true
      - label: Sin foto
        field: image
        empty: true
      - label: Ocultos en la web
        field: visible
        eq: false
    # El nombre del grupo es lo que coincide con el patrón: sale "PVC" o
    # "CPVC Corzan" tal como se escribe en el Excel ("CPVC Corzan" va primero
    # porque contiene "PVC").
    view_groups:
      - label: Material
        field: label
        pattern: CPVC Corzan|PVC
      - label: Agua fría o caliente
        field: label
        pattern: Agua (fría|caliente)
    # Botón "ver en la web" de cada grupo. Lleva al catálogo de su familia
    # filtrado a agua; no indica si la publicación ya terminó.
    preview_path: /productos/{{family}}/agua-pvc-cpvc/
    fields:
      - name: label
        label: Producto
        widget: hidden
      - name: family
        label: Familia
        widget: hidden
      - name: visible
        label: ¿Se ve en la web?
        widget: boolean
        default: true
        before_input: Oculto
        after_input: Visible
        hint: >-
          Oculto = el producto y todas sus medidas dejan de verse en la web, sin
          borrar nada. Al guardar, la web se actualiza en unos 5 minutos.
      - name: technicalSheet
        label: Ficha técnica (PDF)
        widget: file
        required: false
        default: ''
        accept: application/pdf,.pdf
        # Sin "pegar una URL": la ficha tiene que vivir en el repositorio.
        choose_url: false
        # A nivel de campo la ruta DEBE empezar por "/" (raíz del repositorio).
        media_folder: /public/assets/panel/fichas
        public_folder: /assets/panel/fichas
        hint: >-
          Solo PDF, de hasta 10 MB. Si se deja vacío, la web muestra «Ficha
          pendiente». El nombre del archivo se guarda en minúsculas y con
          guiones. Al guardar, la web se actualiza en unos 5 minutos.
      - name: image
        label: Foto del producto
        widget: image
        required: false
        default: ''
        # `accept` explícito: sin él el campo admite SVG (código servido desde
        # el dominio). HEIC/HEIF sólo se aceptan porque raster_image los
        # convierte; la comprobación de `accept` se hace tras convertir.
        accept: image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif
        choose_url: false
        media_folder: /public/assets/panel/fotos
        public_folder: /assets/panel/fotos
        # Un `transformations` de campo reemplaza entero al global: aquí va
        # completo. max_file_size se mide DESPUÉS de convertir. 800 px de sobra:
        # el catálogo la muestra a 40-64 px y carga una por fila.
        media_libraries:
          stock_assets: false
          default:
            config:
              max_file_size: 1000000
              transformations:
                raster_image:
                  format: webp
                  quality: 80
                  width: 800
                  height: 800
        hint: >-
          Es la foto principal de la tabla de su marca en el catálogo (arriba,
          junto al nombre de la marca); las filas no llevan foto. Si varios
          productos de la marca tienen foto, sale la del primero de la tabla.
          Sirve cualquier foto, también la del celular: al subirla se reduce y
          se convierte sola. Al guardar, la web se actualiza en unos 5 minutos.
      # Texto del producto: por ahora sólo lo pinta Tuberías, en la cabecera de
      # la marca junto a la foto (src/data/productTexts.ts). Texto plano: la web
      # lo escapa. Sin `required` ni `pattern`, para no bloquear el guardado de
      # las entradas que no lo usan.
      - name: title
        label: Título del texto (opcional)
        widget: string
        required: false
        default: ''
        maxlength: 120
        hint: >-
          Sale en negrita encima del texto. Por ahora el texto solo se ve en
          Tuberías, junto a la foto de la marca. Si la marca tiene varios productos con texto (Georg Fischer: CPVC y PVC), salen uno debajo del otro: el título ayuda a distinguirlos.
      - name: description
        label: Texto sobre el producto (opcional)
        widget: text
        required: false
        default: ''
        maxlength: 2000
        hint: >-
          Por ahora solo se ve en Tuberías, junto a la foto de la marca; en las
          conexiones no sale. Escríbalo como texto, no como imagen: así lo lee
          Google. Para empezar otro párrafo, deje una línea en blanco. Para una
          lista, empiece cada línea con «•» o con «- »; si una línea de la lista
          empieza con «Algo:», ese «Algo» sale en negrita. En la web se ven unas líneas y el
          botón «Leer más». Al guardar, la web se actualiza en unos 5 minutos.
      - name: groupKey
        label: Código interno
        widget: hidden

  # ═════════════════════════════════════════════════════════════════════════
  # LÍNEA CONTRA INCENDIO (FM)
  #
  # Mismo montaje que los grupos de agua, sobre fm.json: una entrada por
  # producto × marca (15). Las filas (medidas, SKU, SDR) siguen en
  # src/data/fmProducts.ts y buscan su entrada por `key` y su ficha por
  # `sheets.*.key` (el SDR o la clase de la fila). Por eso:
  #   · crear, borrar o duplicar entradas, o añadir, quitar o reordenar fichas,
  #     dejaría filas sin ficha o fichas sin filas: todo bloqueado. El arrastre
  #     de la lista de entradas no se puede quitar, pero es inofensivo (se
  #     busca por key, no por posición).
  #   · label, family, key y sheets.*.key van `hidden`: no se ven y se
  #     conservan al guardar. sheets.*.variant se ve pero es `readonly`.
  # El orden de los campos es el de las claves del JSON, para que un guardado
  # no reordene el archivo.
  # ═════════════════════════════════════════════════════════════════════════
  - name: fm
    label: Línea contra incendio (FM)
    label_singular: Producto FM
    icon: local_fire_department
    description: >-
      Productos de la línea **contra incendio (FM)**, en HDPE. Cada producto de
      una marca tiene su foto, si se ve en la web y su ficha técnica; algunos
      tienen una ficha por presión (SDR o clase). Las medidas y códigos no se
      cambian aquí.
    file: src/data/catalog/fm.json
    create: false
    delete: false
    duplicate: false
    identifier_field: label
    summary: '{{label}}'
    thumbnail: image
    sortable_fields: [label]
    view_filters:
      - label: Sin foto propia
        field: image
        empty: true
      # Un filtro mira un solo campo: con `sheets.*` (comodín) Sveltia (0.252.0)
      # da por vacías TODAS las entradas, así que va uno por posición (como
      # mucho hay 2 fichas). En la 2.ª se usa eq '' y no `empty`, porque
      # `empty` también cuenta como vacía la 2.ª ficha que no existe.
      - label: 'Sin ficha: la 1.ª o única'
        field: sheets.0.technicalSheet
        empty: true
      - label: 'Sin ficha: SDR9, SDR7 o Clase 335'
        field: sheets.1.technicalSheet
        eq: ''
      - label: Ocultos en la web
        field: visible
        eq: false
    # El nombre del grupo es el texto que coincide con el patrón en el nombre.
    view_groups:
      - label: Marca
        field: label
        pattern: Pavco|WL Plastics|Extrucol|Integrity|Georg Fischer
      - label: Producto
        field: label
        pattern: Tubería|Brida|Codo 90°|Codo 45°|Flange Adapter|Reducción|Tapón|Tee
    # Botón "ver en la web": la página FM de su familia.
    preview_path: /productos/{{family}}/contra-incendio-fm/
    fields:
      - name: label
        label: Producto
        widget: hidden
      - name: family
        label: Familia
        widget: hidden
      - name: visible
        label: ¿Se ve en la web?
        widget: boolean
        default: true
        before_input: Oculto
        after_input: Visible
        hint: >-
          Oculto = este producto de esta marca deja de verse en la web con
          todas sus medidas (catálogo, página FM, portada y buscador), sin
          borrar nada. Al guardar, la web se actualiza en unos 5 minutos.
      - name: image
        label: Foto del producto
        widget: image
        required: false
        default: ''
        # Mismas reglas que la foto de los grupos de agua (sin SVG, WebP de
        # 800 px, 1 MB, sin fotos de stock); ver allí el porqué.
        accept: image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif
        choose_url: false
        media_folder: /public/assets/panel/fotos
        public_folder: /assets/panel/fotos
        media_libraries:
          stock_assets: false
          default:
            config:
              max_file_size: 1000000
              transformations:
                raster_image:
                  format: webp
                  quality: 80
                  width: 800
                  height: 800
        hint: >-
          Es la foto principal de la tabla de su marca en el catálogo (arriba,
          junto al nombre de la marca) y la de su tarjeta en la portada, si
          sale ahí; las filas no llevan foto. Si se deja vacía, sale la foto
          general de la línea (la misma para todos). Sirve cualquier foto,
          también la del celular: al subirla se reduce y se convierte sola. Al
          guardar, la web se actualiza en unos 5 minutos.
      - name: sheets
        label: Fichas técnicas
        label_singular: Ficha
        widget: list
        allow_add: false
        allow_remove: false
        allow_duplicate: false
        allow_reorder: false
        collapsed: false
        summary: 'Ficha para: {{variant}}'
        hint: >-
          Una ficha por presión (SDR o clase); «Todas las medidas» vale para
          todo el producto. No se añaden ni se quitan: si una queda vacía, la
          web muestra «Ficha pendiente» en esas filas.
        fields:
          # Visible pero bloqueado: con la ficha abierta Sveltia no pinta el
          # `summary`, y sin esto no se sabe cuál es la de SDR11 y cuál la de
          # SDR9. readonly conserva el valor al guardar (comprobado).
          - name: variant
            label: Para qué medidas
            widget: string
            readonly: true
          - name: technicalSheet
            label: Ficha técnica (PDF)
            widget: file
            required: false
            default: ''
            accept: application/pdf,.pdf
            choose_url: false
            media_folder: /public/assets/panel/fichas
            public_folder: /assets/panel/fichas
            hint: >-
              Solo PDF, de hasta 10 MB. Si se deja vacío, la web muestra
              «Ficha pendiente». El nombre del archivo se guarda en minúsculas
              y con guiones. Si cambia el PDF, revise también la página de
              abajo. Al guardar, la web se actualiza en unos 5 minutos.
          # El sitio arma technicalSheet + "#page=" + page; vacío = sin ancla
          # (el PDF se abre en la primera página).
          - name: page
            label: Página de la tabla en el PDF
            widget: number
            value_type: int
            required: false
            min: 1
            max: 999
            step: 1
            hint: >-
              Opcional. Si la ficha trae varias tablas, el número de página
              donde está la de este SDR: la web abre el PDF directamente ahí.
              Déjelo vacío para que se abra en la primera página.
          - name: key
            label: Código interno
            widget: hidden
      # Texto del producto: por ahora sólo lo pinta Tuberías, en la cabecera de
      # la marca junto a la foto (src/data/productTexts.ts). Texto plano: la web
      # lo escapa. Sin `required` ni `pattern`, para no bloquear el guardado de
      # las entradas que no lo usan.
      - name: title
        label: Título del texto (opcional)
        widget: string
        required: false
        default: ''
        maxlength: 120
        hint: >-
          Sale en negrita encima del texto. Por ahora el texto solo se ve en
          Tuberías, junto a la foto de la marca.
      - name: description
        label: Texto sobre el producto (opcional)
        widget: text
        required: false
        default: ''
        maxlength: 2000
        hint: >-
          Por ahora solo se ve en Tuberías, junto a la foto de la marca; en las
          conexiones no sale. Escríbalo como texto, no como imagen: así lo lee
          Google. Para empezar otro párrafo, deje una línea en blanco. Para una
          lista, empiece cada línea con «•» o con «- »; si una línea de la lista
          empieza con «Algo:», ese «Algo» sale en negrita. En la web se ven unas líneas y el
          botón «Leer más». Al guardar, la web se actualiza en unos 5 minutos.
      - name: key
        label: Código interno
        widget: hidden

  # ═════════════════════════════════════════════════════════════════════════
  # TARJETAS DE LA PÁGINA PRODUCTOS
  #
  # /productos hace exactamente dos cosas con cards.json (src/pages/
  # productos.astro): filtra por `visible` y ordena por `order`. Por eso
  # arrastrar filas no cambiaría nada y `allow_reorder` va en false.
  #
  # slug, family y line construyen el enlace /productos/{family}/?linea={line}:
  # cambiarlos manda al visitante a una página que no existe. Van `hidden`
  # (no se ven y se conservan al guardar; comprobado) y en el orden de las
  # claves del JSON para que un guardado no reordene el archivo.
  # ═════════════════════════════════════════════════════════════════════════
  - name: portada
    label: Tarjetas de portada
    icon: view_cozy
    files:
      - name: tarjetas
        label: Las 4 tarjetas de la página Productos
        icon: view_cozy
        file: src/data/catalog/cards.json
        preview_path: /productos/
        fields:
          - name: cards
            label: Tarjetas
            label_singular: Tarjeta
            widget: list
            allow_add: false
            allow_remove: false
            allow_duplicate: false
            allow_reorder: false
            collapsed: false
            summary: '{{title}} · posición {{order}}'
            thumbnail: image
            hint: >-
              Son 4 tarjetas fijas: no se añaden ni se borran. El orden lo
              decide el número «Posición», no arrastrar.
            fields:
              - name: slug
                label: Identificador
                widget: hidden
              - name: family
                label: Familia
                widget: hidden
              - name: line
                label: Línea
                widget: hidden
              - name: title
                label: Título
                widget: string
                required: true
                maxlength: 40
                hint: >-
                  Lo que se lee en grande debajo de la foto (por ejemplo
                  "Tuberías FM"). Cuanto más corto, mejor: si es largo, en el
                  celular parte en dos líneas.
              - name: subtitle
                label: Subtítulo
                widget: string
                required: true
                maxlength: 70
                hint: >-
                  La línea gris de debajo del título. Es obligatoria: la web la
                  usa también como descripción de la foto para buscadores y
                  lectores de pantalla.
              - name: image
                label: Foto de la tarjeta
                widget: image
                required: true
                # Sin SVG por lo mismo que en los grupos. La ilustración
                # conexiones-fm.svg ya guardada la hizo el equipo; `accept`
                # limita lo que se sube, no lo que ya está guardado.
                accept: image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif
                choose_url: false
                media_folder: /public/assets/panel/tarjetas
                public_folder: /assets/panel/tarjetas
                # Máximo 1600×1200: la tarjeta es 4:3.
                media_libraries:
                  stock_assets: false
                  default:
                    config:
                      max_file_size: 1000000
                      transformations:
                        raster_image:
                          format: webp
                          quality: 82
                          width: 1600
                          height: 1200
                hint: >-
                  Mejor apaisada (más ancha que alta), con el producto centrado
                  y fondo claro: si no es 4:3 la web la recorta por el centro.
                  Sirve cualquier foto, también la del celular: al subirla se
                  reduce y se convierte sola. Al guardar, la web se actualiza en
                  unos 5 minutos.
              - name: visible
                label: ¿Se ve en la página Productos?
                widget: boolean
                default: true
                before_input: Oculta
                after_input: Visible
                hint: >-
                  Oculta = la tarjeta deja de salir, sin borrar nada; las demás
                  se recolocan solas. Al guardar, la web se actualiza en unos 5
                  minutos.
              - name: order
                label: Posición
                widget: number
                value_type: int
                default: 1
                min: 1
                max: 4
                step: 1
                hint: >-
                  De izquierda a derecha: 1 es la primera. No repetir el mismo
                  número en dos tarjetas.

  # ═════════════════════════════════════════════════════════════════════════
  # SERVICIOS
  #
  # Los 4 servicios de /servicios, sobre services.json. El mismo archivo da
  # los nombres del menú «Servicios», las tarjetas de la portada (las de los
  # servicios con texto corto) y los títulos del buscador (src/data/
  # services.ts, que valida todo y nunca bloquea la publicación).
  #
  # `id` es el ancla de cada servicio (/servicios/#termofusion), a la que
  # enlazan el menú, el buscador y los anuncios: va `hidden`. La lista no
  # deja añadir, quitar ni arrastrar: el orden de la lista es el de la página.
  # El orden de los campos es el de las claves del JSON, para que un guardado
  # no reordene el archivo.
  #
  # La descripción es texto plano (Astro lo escapa): el enlace «Quiero hablar
  # con un especialista» lo añade la página.
  # ═════════════════════════════════════════════════════════════════════════
  - name: servicios
    label: Servicios
    icon: handyman
    files:
      - name: servicios
        label: Los 4 servicios
        icon: handyman
        file: src/data/services.json
        preview_path: /servicios/
        fields:
          - name: services
            label: Servicios
            label_singular: Servicio
            widget: list
            allow_add: false
            allow_remove: false
            allow_duplicate: false
            allow_reorder: false
            collapsed: false
            summary: '{{label}}'
            thumbnail: image
            hint: >-
              Son 4 servicios fijos, en el mismo orden que en la web: no se
              añaden, no se borran ni se cambian de orden.
            fields:
              - name: id
                label: Identificador
                widget: hidden
              - name: label
                label: Nombre corto
                widget: string
                required: true
                maxlength: 30
                hint: >-
                  Sale en el menú «Servicios» de arriba, en los botones de la
                  página Servicios y en el mensaje de WhatsApp «Quiero hablar
                  con un especialista». Por ejemplo "Termofusión".
              - name: title
                label: Título
                widget: string
                required: true
                maxlength: 60
                hint: >-
                  El título grande del servicio en la página Servicios (y en la
                  portada, si sale allí). Por ejemplo "Soldadura por
                  Termofusión".
              - name: description
                label: Descripción
                widget: text
                required: true
                maxlength: 800
                hint: >-
                  El texto del servicio en la página Servicios. Para empezar
                  otro párrafo, deje una línea en blanco. El enlace «Quiero
                  hablar con un especialista» lo pone la web sola, debajo.
              - name: homeSummary
                label: Texto corto para la portada
                widget: string
                required: false
                default: ''
                maxlength: 90
                hint: >-
                  Si lo escribe, el servicio sale también en la portada, con su
                  foto, su título y este texto. Si lo deja vacío, no sale en la
                  portada (sí en la página Servicios). Lo ideal son 2 o 4
                  servicios en la portada, para que las tarjetas queden parejas.
              - name: image
                label: Foto
                widget: image
                required: false
                default: ''
                # Sin SVG por lo mismo que en los grupos.
                accept: image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif
                choose_url: false
                media_folder: /public/assets/panel/servicios
                public_folder: /assets/panel/servicios
                # Máximo 1600×1200: la página la muestra a unos 650×400 px
                # (el doble en pantallas de alta densidad).
                media_libraries:
                  stock_assets: false
                  default:
                    config:
                      max_file_size: 1000000
                      transformations:
                        raster_image:
                          format: webp
                          quality: 82
                          width: 1600
                          height: 1200
                hint: >-
                  Se ve entera, sin recortes, en la página Servicios; en la
                  portada se recorta por el centro. Mejor apaisada (más ancha
                  que alta). Sirve cualquier foto, también la del celular: al
                  subirla se reduce y se convierte sola. Si la deja vacía, la
                  web muestra «Imagen próximamente». Al guardar, la web se
                  actualiza en unos 5 minutos.
