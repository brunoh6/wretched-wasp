<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      El panel es una herramienta interna: no queremos que Google lo indexe ni
      que aparezca en resultados de búsqueda junto al catálogo público.
      (No es una medida de seguridad: la seguridad la da el login de GitHub.)
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel DIHYC</title>
    <!-- Sveltia lo sustituye por logo.src de config.yml en cuanto carga. -->
    <link rel="icon" href="/admin/logo-panel.png?v=2" type="image/png" />
  </head>
  <body>
    <!--
      Sveltia CMS se carga como UN SOLO script clásico desde la CDN.

      Dos avisos explícitos de la documentación oficial
      (https://sveltiacms.app/en/docs/start) que hay que respetar:
        1. NO añadir type="module" al script.
        2. NO enlazar ninguna hoja de estilos.

      VERSIÓN FIJADA (0.252.0). Sin versión, unpkg sirve la última: entre
      0.205.2 y 0.252.0 hubo 100 versiones y dos cambios incompatibles
      (v0.223.0 dejó de mostrar las ayudas escritas con `comment`), y el panel
      cambiaba de un día para otro sin tocar el repositorio.

      integrity = sha384 del archivo EXACTO de esa versión: si la CDN sirviera
      otra cosa, el navegador no lo ejecuta (el panel tiene permiso de escritura
      sobre el repositorio). crossorigin="anonymous" es obligatorio con
      integrity en un script de otro dominio. Los idiomas y los módulos extra
      los descarga el propio Sveltia de la misma versión.

      Para subir de versión: README-admin.md, parte 2, "Actualizar Sveltia"
      (cambiar versión e integrity aquí y el $schema de config.yml a la vez).
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.252.0/dist/sveltia-cms.js"
      integrity="sha384-1lhFs8+tXG4MV80L+/4enmKGio3aT9qrPGfM8/OTuo7Td7z+PW/8eOZBUXgXwRRc"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
