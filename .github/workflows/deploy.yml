# ─────────────────────────────────────────────────────────────────────────────
# Construir y publicar www.dihyc.com.pe en el cPanel de la empresa.
#
# Flujo: push a main (o un guardado desde el panel /admin) → compilar y validar
# → publicar por FTPS o por SSH → prueba automática contra el sitio en vivo.
#
# CÓMO SE ELIGE EL MÉTODO (Settings → Secrets and variables → Actions → Variables)
#   DEPLOY_METHOD = ftps   → publica por FTP cifrado (lo que siempre trae cPanel)
#   DEPLOY_METHOD = ssh    → publica por rsync sobre SSH (si el hosting lo permite)
#   (sin la variable)      → SÓLO compila y valida. Un push nunca falla por falta
#                            de credenciales; nada se publica hasta configurarlo.
#
# Guía paso a paso para configurarlo: README-deploy.md
#
# ⚠ El push de este archivo exige un token de GitHub con permiso "workflow".
#   Sin él GitHub rechaza el push (pasó en el commit b23c350, "push without
#   workflow", que borró un deploy.yml anterior para poder subir lo demás).
#
# Todas las actions externas van fijadas por SHA de commit completo, no por
# etiqueta: una etiqueta se puede mover a otro código; un SHA no.
# SHAs obtenidos con `git ls-remote` (octubre 2026).
# ─────────────────────────────────────────────────────────────────────────────

name: Construir y publicar

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions de GitHub.
  workflow_dispatch:

# Permisos mínimos: sólo leer el repositorio.
permissions:
  contents: read

# El panel /admin guarda cada cambio como un commit y el cliente puede guardar
# varias veces seguidas. NUNCA se cancela una publicación a medias (dejaría el
# sitio con archivos de dos versiones): las ejecuciones se ponen en cola y, si se
# acumulan varias, GitHub conserva sólo la más reciente, que es la que importa.
concurrency:
  group: publicar-dihyc
  cancel-in-progress: false

env:
  SITIO: https://www.dihyc.com.pe

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  construir:
    name: Compilar y validar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Después de descargar no hace falta seguir autenticado contra GitHub.
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro 5 NO admite Node 18 (el workflow anterior usaba 18 y nunca
          # habría compilado).
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        # `npm ci` respeta package-lock.json al pie de la letra: la compilación
        # aquí es idéntica a la de local.
        run: npm ci

      - name: Compilar
        env:
          # Marca de versión: cada página lleva <meta name="dihyc-build"> con el
          # commit. La prueba final la usa para confirmar que lo que se ve en
          # vivo es ESTA versión y no una copia vieja en caché.
          PUBLIC_BUILD_ID: ${{ github.sha }}
          # Medición (README-deploy.md, sección 6): Google Ads, Google
          # Analytics 4 y Microsoft Clarity. Sin sus variables no se carga nada
          # de Google ni de Microsoft; con cada ID, el HTML lleva su etiqueta y
          # "npm run build" amplía la CSP de dist/.htaccess
          # (scripts/csp-medicion.mjs). Son variables, no secrets: los IDs y
          # las etiquetas se ven en el HTML publicado.
          PUBLIC_GOOGLE_ADS_ID: ${{ vars.GOOGLE_ADS_ID }}
          PUBLIC_ADS_LABEL_WHATSAPP: ${{ vars.ADS_LABEL_WHATSAPP }}
          PUBLIC_ADS_LABEL_FORMULARIO: ${{ vars.ADS_LABEL_FORMULARIO }}
          PUBLIC_ADS_LABEL_LLAMADA: ${{ vars.ADS_LABEL_LLAMADA }}
          PUBLIC_GA4_ID: ${{ vars.GA4_ID }}
          PUBLIC_CLARITY_ID: ${{ vars.CLARITY_ID }}
        run: npm run build

      - name: Validar el sitio compilado
        # Si falta algo de esto, mejor fallar aquí que publicar un sitio roto.
        env:
          ADS_ID: ${{ vars.GOOGLE_ADS_ID }}
          ADS_LABEL_WHATSAPP: ${{ vars.ADS_LABEL_WHATSAPP }}
          ADS_LABEL_FORMULARIO: ${{ vars.ADS_LABEL_FORMULARIO }}
          ADS_LABEL_LLAMADA: ${{ vars.ADS_LABEL_LLAMADA }}
          GA4_ID: ${{ vars.GA4_ID }}
          CLARITY_ID: ${{ vars.CLARITY_ID }}
        run: |
          set -euo pipefail
          falta=0
          # Las cuatro páginas por línea son las URL finales de los anuncios.
          for f in index.html 404.html .htaccess robots.txt sitemap-index.xml \
                   productos/index.html productos/tuberias/index.html productos/conexiones/index.html \
                   productos/tuberias/contra-incendio-fm/index.html productos/conexiones/contra-incendio-fm/index.html \
                   productos/tuberias/agua-pvc-cpvc/index.html productos/conexiones/agua-pvc-cpvc/index.html \
                   admin/index.html admin/config.yml admin/.htaccess; do
            if [ ! -f "dist/$f" ]; then echo "::error::Falta dist/$f"; falta=1; fi
          done
          [ "$falta" = 0 ] || exit 1

          grep -q "name=\"dihyc-build\" content=\"${GITHUB_SHA}\"" dist/index.html \
            || { echo "::error::La marca de versión no lleva el commit ${GITHUB_SHA}"; exit 1; }

          # Medición (Google Ads, GA4, Clarity). Con cada ID, cada página del
          # sitio (no /admin) lleva su etiqueta UNA vez y la CSP de
          # dist/.htaccess deja pasar sus dominios; si no, el navegador la
          # bloquearía en silencio y no se mediría nada. Sin un ID, ni rastro
          # de esa herramienta en el HTML ni en la CSP. Los dominios son los de
          # scripts/csp-medicion.mjs (guías oficiales de Google y Microsoft).
          python3 - <<'PY'
          import json, os, pathlib, re, sys
          ids = {k: "".join(os.environ.get(k, "").split()) for k in ("ADS_ID", "GA4_ID", "CLARITY_ID")}
          ads, ga4, cla = ids["ADS_ID"], ids["GA4_ID"], ids["CLARITY_ID"]
          errores = []
          def error(m): errores.append(m); print(f"::error::{m}")

          GTM = "https://www.googletagmanager.com"
          ADS = [GTM, "https://www.googleadservices.com", "https://googleads.g.doubleclick.net",
                 "https://pagead2.googlesyndication.com", "https://www.google.com", "https://www.google.com.pe"]
          GA4 = [GTM, "https://*.google-analytics.com", "https://*.google.com", "https://*.google.com.pe", "https://*.g.doubleclick.net"]
          CLA = ["https://*.clarity.ms", "https://c.bing.com"]
          pide = {}
          def pedir(d, xs): pide.setdefault(d, []).extend(xs)
          if ads:
              pedir("script-src", [GTM, "https://www.googleadservices.com", "https://www.google.com"]); pedir("img-src", ADS)
              pedir("connect-src", ADS + ["https://ad.doubleclick.net"]); pedir("frame-src", [GTM])
          if ga4:
              pedir("script-src", [GTM]); pedir("img-src", GA4)
              pedir("connect-src", GA4 + ["https://pagead2.googlesyndication.com"]); pedir("frame-src", [GTM])
          if cla:
              for d in ("script-src", "img-src", "connect-src"): pedir(d, CLA)

          # 1) CSP de páginas en dist/.htaccess.
          texto = pathlib.Path("dist/.htaccess").read_text(encoding="utf-8")
          m = re.findall(r"""Header always set Content-Security-Policy "(default-src 'self';[^"]*)" env=DIHYC""", texto)
          if len(m) != 1:
              error(f"dist/.htaccess debería tener UNA CSP de páginas y tiene {len(m)}"); sys.exit(1)
          csp = {d.split()[0]: d.split()[1:] for d in (x.strip() for x in m[0].split(";")) if d}
          for d, xs in pide.items():
              for x in dict.fromkeys(xs):
                  if x not in csp.get(d, []): error(f"La CSP de dist/.htaccess no permite {d} {x} (¿falló scripts/csp-medicion.mjs?)")
          prohibidos = []
          if not (ads or ga4): prohibidos += ["googletagmanager.com", "google-analytics.com", "googleadservices.com", "doubleclick.net", "googlesyndication.com"]
          if not ads: prohibidos += ["googleadservices.com"]
          if not ga4: prohibidos += ["google-analytics.com"]
          if not cla: prohibidos += ["clarity.ms", "bing.com"]
          for p in dict.fromkeys(prohibidos):
              if p in texto: error(f"dist/.htaccess menciona {p} sin la variable que lo activa")

          # 2) HTML de cada página del sitio (/admin no lleva medición).
          paginas = [f for f in pathlib.Path("dist").rglob("*.html") if not f.as_posix().startswith("dist/admin/")]
          gtag_ids = [x for x in (ads, ga4) if x]
          for f in paginas:
              h = f.read_text(encoding="utf-8")
              n_gtag = h.count('src="https://www.googletagmanager.com/gtag/js?id=')
              if gtag_ids:
                  if n_gtag != 1 or f'gtag/js?id={gtag_ids[0]}"' not in h:
                      error(f"{f}: gtag.js debería cargarse UNA vez con {gtag_ids[0]} (hay {n_gtag})")
                  c = re.findall(r"const gtagIds = (\[[^\]]*\]);", h)
                  if len(c) != 1 or json.loads(c[0]) != gtag_ids:
                      error(f"{f}: los config de gtag deberían ser {gtag_ids} y son {c}")
              elif re.search(r"googletagmanager\.com|google-analytics\.com|googleadservices\.com", h):
                  error(f"{f}: sin GOOGLE_ADS_ID ni GA4_ID el HTML no debería cargar nada de Google")
              med = re.findall(r"const medicion = (\{.*?\});\n", h)
              if len(med) != 1 or json.loads(med[0]).get("id") != ads or json.loads(med[0]).get("ga4") != ga4:
                  error(f"{f}: el escucha de medición no lleva los IDs esperados ({med[:1]})")
              n_cla = h.count('"https://www.clarity.ms/tag/"')
              if cla:
                  if n_cla != 1 or h.count(f'const clarityId = "{cla}";') != 1:
                      error(f"{f}: el código de Clarity debería estar UNA vez con {cla} (hay {n_cla})")
                  if 'id="contactForm"' in h and 'data-clarity-mask="True"' not in h:
                      error(f"{f}: el formulario debería ir enmascarado para Clarity (data-clarity-mask)")
              elif "clarity.ms" in h or "data-clarity-mask" in h:
                  error(f"{f}: sin CLARITY_ID el HTML no debería traer nada de Clarity")
          if errores: sys.exit(1)
          print(f"Medición revisada en {len(paginas)} páginas y en la CSP.")
          PY
          ADS_ID="$(echo "$ADS_ID" | tr -d '[:space:]')"
          GA4_ID="$(echo "$GA4_ID" | tr -d '[:space:]')"
          CLARITY_ID="$(echo "$CLARITY_ID" | tr -d '[:space:]')"
          if [ -n "$ADS_ID" ]; then
            for tipo in WHATSAPP FORMULARIO LLAMADA; do
              var="ADS_LABEL_${tipo}"
              [ -n "${!var}" ] || echo "::warning::Sin la variable ${var}: esa conversión NO se cuenta en Google Ads (sólo queda en dataLayer)."
            done
            echo "Google Ads ${ADS_ID}: etiqueta en el HTML y CSP ampliada."
          else
            echo "Google Ads: sin GOOGLE_ADS_ID, medición apagada (sólo dataLayer)."
          fi
          if [ -n "$GA4_ID" ]; then echo "Google Analytics 4 ${GA4_ID}: etiqueta en el HTML y CSP ampliada."
          else echo "Google Analytics 4: sin GA4_ID, apagado (los eventos quedan sólo en dataLayer)."; fi
          if [ -n "$CLARITY_ID" ]; then echo "Clarity ${CLARITY_ID}: código en el HTML, formulario enmascarado y CSP ampliada."
          else echo "Clarity: sin CLARITY_ID, apagado."; fi

          if grep -rl "localhost" dist --include='*.html' | grep -q .; then
            echo "::error::Hay enlaces a localhost en el HTML compilado:"
            grep -rl "localhost" dist --include='*.html'
            exit 1
          fi
          # Archivos que el HTML cita y no existen. En el servidor (Linux) el
          # nombre debe coincidir byte a byte: mayúsculas, tildes y "ñ" incluidas
          # (en un Mac "Ñ" y "N+~" son el mismo archivo; aquí no).
          # ERROR (no se publica) si falta una ficha, una foto de catálogo o algo
          # del panel: la biblioteca del panel deja borrar archivos y el sitio
          # publicado quedaría con enlaces rotos. El resto (p. ej. /assets/services/,
          # cuya foto de alquiler falta a propósito) sigue siendo sólo aviso.
          # Mientras falte un archivo crítico NINGUNA publicación sale, tampoco
          # los guardados posteriores del panel: hay que restaurarlo o quitar la cita.
          python3 - <<'PY'
          import os, re, sys, html, pathlib, urllib.parse
          dist = pathlib.Path("dist")
          def existe(ruta):
              p = dist
              for parte in ruta.strip("/").split("/"):
                  if not p.is_dir() or parte not in os.listdir(p):
                      return False
                  p = p / parte
              return p.is_file()
          faltan = {}
          for f in dist.rglob("*.html"):
              texto = f.read_text(encoding="utf-8")
              rutas = []
              # srcset aparte: "a.webp 960w, b.webp 1920w" son DOS archivos. Fuera
              # de srcset los espacios sí son parte del nombre (las fichas los llevan).
              # data-srcset: el carrusel difiere las diapositivas 2-4 con él.
              def candidatos(m):
                  rutas.extend(c.split()[0] for c in m.group(2).split(",") if c.strip())
                  return " "
              texto = re.sub(r"""\s(?:data-)?srcset=(["'])(.*?)\1""", candidatos, texto)
              rutas += re.findall(r"""["'](/(?:assets|_astro)/[^"'#?<>\\]+)""", texto)
              for r in rutas:
                  ruta = urllib.parse.unquote(html.unescape(r))
                  if ruta.startswith(("/assets/", "/_astro/")) and "${" not in ruta and not existe(ruta):
                      faltan.setdefault(ruta, set()).add(str(f.relative_to(dist)))
          criticas = ("/assets/fichas-tecnicas/", "/assets/hero/", "/assets/categories/",
                      "/assets/products/", "/assets/materiales/", "/assets/panel/")
          errores = 0
          for ruta, pags in sorted(faltan.items()):
              nivel = "error" if ruta.startswith(criticas) else "warning"
              errores += nivel == "error"
              print(f"::{nivel}::{ruta} no existe en el sitio (citado en {', '.join(sorted(pags))})")
          print(f"Archivos citados que faltan: {len(faltan)} ({errores} críticos)")
          sys.exit(1 if errores else 0)
          PY

          echo "Sitio compilado OK: $(find dist -type f | wc -l) archivos, $(du -sh dist | cut -f1)."

      - name: Guardar el sitio compilado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitio-compilado
          path: dist/
          # IMPRESCINDIBLE: sin esto se pierden .htaccess y admin/.htaccess (los
          # archivos que empiezan por punto se excluyen por defecto) y el sitio
          # se publicaría sin redirecciones, sin seguridad y sin página 404.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          # "Re-run all jobs" vuelve a subir este artifact con el mismo nombre.
          overwrite: true

  # ═══════════════════════════════════════════════════════════════════════════
  publicar-ftps:
    name: Publicar por FTPS
    needs: construir
    if: vars.DEPLOY_METHOD == 'ftps'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://www.dihyc.com.pe
    steps:
      - name: Comprobar que las credenciales están cargadas
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Falta el secret $v (ver README-deploy.md)"; exit 1; }
          done

      - name: Descargar el sitio compilado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sitio-compilado
          path: dist/

      - name: Subir a public_html
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          # OJO: esta action trae por defecto protocol "ftp" (SIN cifrar: la
          # contraseña viajaría en texto plano) y security "loose" (acepta
          # cualquier certificado). Por eso ambos van explícitos.
          protocol: ftps
          # strict = sólo acepta un certificado válido para FTP_SERVER. El FTP de
          # cPanel presenta el certificado del NOMBRE DEL SERVIDOR
          # (host101.latinoamericahosting.com), no el de ftp.dihyc.com.pe que
          # muestra "Configurar cliente FTP": FTP_SERVER debe ser ese nombre.
          # "loose" sólo como último recurso (README-deploy.md: cifra igual, pero
          # no verifica con quién habla).
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./dist/
          # Recomendado: crear la cuenta FTP en cPanel con directorio public_html,
          # así "./" ES public_html y la cuenta no puede tocar nada más.
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # La action guarda en el servidor .ftp-deploy-sync-state.json con la
          # lista de lo que subió, y en cada publicación sólo borra archivos de
          # esa lista. Lo que no subió ella (cgi-bin, .well-known del SSL, la
          # carpeta de otro dominio) nunca se toca. dangerous-clean-slate queda
          # en su valor por defecto (false) a propósito. El .htaccess bloquea el
          # acceso público a ese archivo de estado.
          log-level: standard

  # ═══════════════════════════════════════════════════════════════════════════
  publicar-ssh:
    name: Publicar por SSH (rsync)
    needs: construir
    if: vars.DEPLOY_METHOD == 'ssh'
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: https://www.dihyc.com.pe
    steps:
      - name: Descargar el sitio compilado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sitio-compilado
          path: dist/

      - name: Preparar la conexión SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          for v in SSH_KEY SSH_KNOWN_HOSTS SSH_HOST SSH_USER; do
            [ -n "${!v}" ] || { echo "::error::Falta el secret $v (ver README-deploy.md)"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # La huella del servidor se FIJA desde un secret. Nunca se desactiva la
          # verificación (StrictHostKeyChecking=no): sin ella, cualquiera que se
          # interponga en la red podría hacerse pasar por el hosting y recibir el
          # sitio y la llave.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Subir con rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DESTINO: ${{ vars.SSH_TARGET_DIR || 'public_html/' }}
          BORRAR: ${{ vars.SSH_ALLOW_DELETE || 'false' }}
          PROTEGER: ${{ vars.DEPLOY_PROTECT || '' }}
        run: |
          set -euo pipefail
          # -rltz: recursivo, enlaces, fechas y compresión. NO se usa -a: intentaría
          # conservar dueño y grupo, cosa que una cuenta de hosting no puede hacer.
          # --chmod: carpetas 755 y archivos 644, los permisos que cPanel espera
          # (con permisos más abiertos algunos servidores responden error 500).
          args=(-rltz --chmod=D755,F644
                -e "ssh -i $HOME/.ssh/deploy_key -p ${SSH_PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts")

          # Borrar en el servidor lo que ya no existe en el sitio está APAGADO por
          # defecto. Un --delete mal apuntado puede borrar el sitio de otro dominio
          # alojado dentro de public_html, o .well-known/ (y con ella la
          # renovación del SSL). Sólo se activa con SSH_ALLOW_DELETE=true, y aun
          # así esas rutas quedan protegidas.
          if [ "$BORRAR" = "true" ]; then
            case "$DESTINO" in
              ""|"/"|"."|"./"|"~"|"~/")
                echo "::error::Con SSH_ALLOW_DELETE=true el destino no puede ser '$DESTINO'. Usa public_html/"; exit 1 ;;
            esac
            args+=(--delete
                   --filter='P .well-known/'
                   --filter='P cgi-bin/'
                   --filter='P .ftp-deploy-sync-state.json')
            for ruta in $PROTEGER; do args+=(--filter="P ${ruta}"); done
            echo "Modo con borrado. Protegidas: .well-known/ cgi-bin/ .ftp-deploy-sync-state.json ${PROTEGER}"
          else
            echo "Modo sin borrado: sólo se añaden y actualizan archivos."
          fi

          rsync "${args[@]}" dist/ "${SSH_USER}@${SSH_HOST}:${DESTINO}"

      - name: Borrar la llave del runner
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ═══════════════════════════════════════════════════════════════════════════
  probar-en-vivo:
    name: Probar el sitio en vivo
    needs: [publicar-ftps, publicar-ssh]
    # Corre si UNO de los dos métodos publicó con éxito (el otro queda omitido).
    if: >-
      always() &&
      (needs.publicar-ftps.result == 'success' || needs.publicar-ssh.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar páginas, redirecciones y versión publicada
        env:
          ADS_ID: ${{ vars.GOOGLE_ADS_ID }}
          GA4_ID: ${{ vars.GA4_ID }}
          CLARITY_ID: ${{ vars.CLARITY_ID }}
        run: |
          # Sin -e a propósito: cada comprobación anota su fallo en $fallos y la
          # prueba sigue, para ver TODOS los problemas de una vez. GitHub lanza
          # "bash -e" por defecto, por eso se desactiva explícitamente.
          set +e
          set -uo pipefail
          fallos=0
          codigo() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1"; }
          salto()  { curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$1"; }

          # 1) La portada debe traer ESTE commit. Se reintenta ~3 minutos por si el
          #    hosting tarda en servir la versión nueva.
          for intento in $(seq 1 12); do
            # La página se guarda ANTES de buscar en ella. "curl | grep -q" con
            # pipefail falla en falso: grep cierra la tubería al encontrar la
            # marca y curl, que aún escribía el resto, termina con error.
            portada=$(curl -s --max-time 20 "$SITIO/")
            if [[ "$portada" == *"name=\"dihyc-build\" content=\"${GITHUB_SHA}\""* ]]; then
              echo "✅ La portada en vivo es la versión ${GITHUB_SHA}"; break
            fi
            if [ "$intento" = 12 ]; then
              echo "::error::La portada en vivo no muestra la versión ${GITHUB_SHA}"; fallos=1
            else
              echo "Esperando la versión nueva (intento $intento/12)…"; sleep 15
            fi
          done

          # 2) Páginas que deben responder 200.
          #    Incluye las cuatro páginas por línea: son las URL finales de los
          #    anuncios y un 404 ahí es dinero perdido (y anuncio rechazado).
          for ruta in / /productos/ /productos/tuberias/ /productos/conexiones/ \
                      /productos/tuberias/contra-incendio-fm/ /productos/conexiones/contra-incendio-fm/ \
                      /productos/tuberias/agua-pvc-cpvc/ /productos/conexiones/agua-pvc-cpvc/ \
                      /servicios/ /empresa/ /contacto/ /admin/ /robots.txt /sitemap-index.xml; do
            c=$(codigo "$SITIO$ruta")
            if [ "$c" = 200 ]; then echo "✅ $c $ruta"; else echo "::error::$ruta respondió $c (esperado 200)"; fallos=1; fi
          done

          # 3) Una ruta inexistente debe dar 404 (y no 200 ni 500).
          c=$(codigo "$SITIO/esta-ruta-no-existe-${GITHUB_SHA}")
          if [ "$c" = 404 ]; then echo "✅ 404 en rutas inexistentes"; else echo "::error::Ruta inexistente respondió $c (esperado 404)"; fallos=1; fi

          # 4) Sin www y sin https deben llevar a la dirección canónica en un salto.
          for origen in "http://dihyc.com.pe/" "https://dihyc.com.pe/" "http://www.dihyc.com.pe/"; do
            r=$(salto "$origen")
            if [ "$r" = "301 https://www.dihyc.com.pe/" ]; then echo "✅ $origen → 301 a https://www"
            else echo "::error::$origen respondió '$r' (esperado 301 a https://www.dihyc.com.pe/)"; fallos=1; fi
          done

          # 5) Las direcciones del sitio viejo (PHP) llevan a las páginas nuevas.
          #    Si fallara, el servidor estaría mostrando el sitio viejo en ellas.
          for par in "/index.php|https://www.dihyc.com.pe/" "/productos.php|https://www.dihyc.com.pe/productos/"; do
            r=$(salto "$SITIO${par%%|*}")
            if [ "$r" = "301 ${par#*|}" ]; then echo "✅ ${par%%|*} → 301 ${par#*|}"
            else echo "::error::${par%%|*} respondió '$r' (esperado 301 a ${par#*|})"; fallos=1; fi
          done
          #    Y el panel viejo y su copia de pruebas siguen cerrados.
          for ruta in /adminxL242/ /test/; do
            c=$(codigo "$SITIO$ruta")
            if [ "$c" = 410 ]; then echo "✅ $ruta cerrado (410)"
            else echo "::error::$ruta respondió $c (esperado 410: carpeta vieja cerrada)"; fallos=1; fi
          done

          # 6) Cabeceras de seguridad: AVISO, no error. Si el hosting no tiene
          #    mod_headers el sitio funciona igual, pero conviene saberlo.
          cab=$(curl -s -o /dev/null -D - --max-time 20 "$SITIO/")
          for h in Content-Security-Policy Strict-Transport-Security X-Content-Type-Options X-Frame-Options; do
            if grep -qi "^$h:" <<<"$cab"; then echo "✅ cabecera $h"
            else echo "::warning::El sitio en vivo no envía $h (¿mod_headers desactivado en el hosting?)"; fi
          done
          #    Con medición activa, la CSP en vivo debe dejar pasar cada
          #    etiqueta. Error (no aviso): si el servidor manda una CSP vieja, la
          #    etiqueta queda bloqueada y no se mide nada.
          csp=$(grep -i '^content-security-policy:' <<<"$cab" | head -1)
          ADS_ID="$(echo "$ADS_ID" | tr -d '[:space:]')"
          GA4_ID="$(echo "$GA4_ID" | tr -d '[:space:]')"
          CLARITY_ID="$(echo "$CLARITY_ID" | tr -d '[:space:]')"
          if [ -n "$ADS_ID" ] && [ -n "$csp" ]; then
            if [[ "$csp" == *"https://www.googletagmanager.com"* && "$csp" == *"https://www.google.com.pe"* && "$csp" == *"https://googleads.g.doubleclick.net"* ]]; then
              echo "✅ la CSP en vivo permite la etiqueta de Google Ads"
            else echo "::error::La CSP en vivo no incluye los dominios de Google Ads: la etiqueta quedaría bloqueada"; fallos=1; fi
          fi
          if [ -n "$GA4_ID" ] && [ -n "$csp" ]; then
            if [[ "$csp" == *"https://www.googletagmanager.com"* && "$csp" == *"https://*.google-analytics.com"* && "$csp" == *"https://*.google.com "* ]]; then
              echo "✅ la CSP en vivo permite Google Analytics 4"
            else echo "::error::La CSP en vivo no incluye los dominios de GA4: Analytics quedaría bloqueado"; fallos=1; fi
          fi
          if [ -n "$CLARITY_ID" ] && [ -n "$csp" ]; then
            if [[ "$csp" == *"https://*.clarity.ms"* && "$csp" == *"https://c.bing.com"* ]]; then
              echo "✅ la CSP en vivo permite Clarity"
            else echo "::error::La CSP en vivo no incluye los dominios de Clarity: quedaría bloqueado"; fallos=1; fi
          fi
          #    Y la portada en vivo (ya de este commit) lleva cada etiqueta.
          if [ -n "$ADS_ID$GA4_ID" ]; then
            gids=$(echo $ADS_ID $GA4_ID)
            if [[ "$portada" == *"googletagmanager.com/gtag/js?id="* && "$portada" == *"\"${ADS_ID:-$GA4_ID}\""* && "$portada" == *"\"${GA4_ID:-$ADS_ID}\""* ]]; then
              echo "✅ la portada en vivo carga gtag.js con ${gids}"
            else echo "::error::La portada en vivo no trae gtag.js con ${gids}"; fallos=1; fi
          fi
          if [ -n "$CLARITY_ID" ]; then
            if [[ "$portada" == *"https://www.clarity.ms/tag/"* && "$portada" == *"\"${CLARITY_ID}\""* ]]; then
              echo "✅ la portada en vivo trae el código de Clarity ${CLARITY_ID}"
            else echo "::error::La portada en vivo no trae el código de Clarity ${CLARITY_ID}"; fallos=1; fi
          fi

          # 7) /admin debe recibir SÓLO su política (admin/.htaccess). Si el
          #    servidor sumara la del sitio, el panel no cargaría.
          adm=$(curl -s -o /dev/null -D - --max-time 20 "$SITIO/admin/")
          n=$(grep -ci '^content-security-policy:' <<<"$adm")
          if [ "$n" = 1 ] && grep -qi "frame-ancestors 'none'" <<<"$adm"; then echo "✅ /admin/ con su propia política"
          elif [ "$n" = 0 ]; then echo "::warning::/admin/ no envía Content-Security-Policy"
          else echo "::warning::/admin/ envía $n políticas de seguridad: si el panel no carga, revisar public/admin/.htaccess"; fi

          exit $fallos
